# Acceptance-тесты (функции TestAcc*, TF_ACC=1) работают с настоящим
# PlatformCraft API: создают и удаляют реальные бакеты и объекты. Поэтому они
# не запускаются на каждый push/PR (см. ci.yml), а только вручную
# (Actions → Acceptance Tests → Run workflow), с секретами репозитория.
#
# Нужные секреты репозитория: PLATFORMCRAFT_ACCESS_KEY, PLATFORMCRAFT_SECRET_KEY.
# Подробности — TESTING.md, разделы 5.2 и 5.3.
name: Acceptance Tests

on:
  workflow_dispatch:
    inputs:
      run:
        description: 'Регулярное выражение для go test -run (по умолчанию все TestAcc*)'
        required: false
        default: '^TestAcc'

permissions:
  contents: read

# Два прогона одновременно на одном аккаунте только мешают друг другу.
concurrency:
  group: acceptance-tests
  cancel-in-progress: false

jobs:
  acceptance-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      # Terraform >= 1.10 нужен для тестов ephemeral-ресурсов (presigned URL).
      # terraform_wrapper: false — terraform-plugin-testing вызывает бинарник
      # напрямую и не должен получать обёртку setup-terraform.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.x'
          terraform_wrapper: false

      - name: go build
        run: go build -v ./...

      - name: Acceptance tests
        env:
          TF_ACC: '1'
          PLATFORMCRAFT_ACCESS_KEY: ${{ secrets.PLATFORMCRAFT_ACCESS_KEY }}
          PLATFORMCRAFT_SECRET_KEY: ${{ secrets.PLATFORMCRAFT_SECRET_KEY }}
          TEST_RUN: ${{ github.event.inputs.run || '^TestAcc' }}
        run: go test -v -count=1 -timeout 50m -run "$TEST_RUN" ./internal/provider/
